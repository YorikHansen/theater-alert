[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theater-alert"
version = "1.0.2"
description = "Notifies Discord users about new and changed events at Theater Kiel."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    "beautifulsoup4>=4.13",
    "Pillow>=11.2",
    "playwright>=1.65.2",
    "PyNaCl>=1.5",
    "typer>=0.29.2",
    "tzdata>=2025.2",
]

[project.scripts]
theater-alert = "theater_alert.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/theater_alert"]

[dependency-groups]
dev = [
    "pytest>=8.4",
]
